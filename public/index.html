<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My App</title>
<style>
:root { --accent: #1E88E5; }
body {
font-family: Arial, sans-serif;
max-width: 560px; margin: 2rem auto; padding: 0 1rem;
}
h1 { color: var(--accent); }
.banner {
background: var(--accent); color: #ffffff;
padding: 0.6rem 1rem; border-radius: 6px;
}
form { display: flex; gap: 0.5rem; margin: 1rem 0; }
input { flex: 1; padding: 0.5rem; }
button {
background: var(--accent); color: #ffffff;
border: 0; padding: 0.5rem 1rem; border-radius: 4px;
}
</style>
</head>

<body>
<h1 id="title">Loading...</h1>
<p class="banner" id="banner"></p>
<form id="form">
<input id="text" required>
<button>Add</button>
</form>
<ul id="list"></ul>

<script>
async function load() {
const info = await (await fetch("/api/info")).json();
document.title = info.title;
document.getElementById("title").textContent = info.title + " by " + info.owner;
document.getElementById("banner").textContent = info.message;
document.getElementById("text").placeholder = "Add a " + info.itemName;
const items = await (await fetch("/api/items")).json();
const list = document.getElementById("list");
list.innerHTML = "";
items.forEach((i) => {
const li = document.createElement("li");
li.textContent = i.text;
list.appendChild(li);
});
}
document.getElementById("form").addEventListener("submit", async (e) => {
e.preventDefault();
const box = document.getElementById("text");
await fetch("/api/items", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ text: box.value }),
});
box.value = "";
load();
});
load();
</script>
</body>
</html>
